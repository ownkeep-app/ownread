name: ownread
description: 本地阅读 — offline TXT novel reader for Android and macOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  file_picker: ^8.3.7
  shadcn_ui: ^0.46.0
  lucide_icons_flutter: ^3.1.14
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  flutter_dotenv: ^6.0.1
  charset: ^2.0.1
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  lucide_icons_flutter: ^3.1.14

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  macos:
    generate: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#E07A3D"
  adaptive_icon_foreground: assets/icon/app_icon.png
